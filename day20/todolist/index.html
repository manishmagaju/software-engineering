<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Main container -->
    <main class="max-w-2xl mx-auto px-4 py-10">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800">
                My Todo List
            </h1>

            <p class="text-gray-500 mt-2">
                Organize your tasks easily
            </p>
        </div>


        <!-- Todo input section -->
        <div class="bg-white p-4 rounded-xl shadow-md flex gap-3">

            <!-- Input where user types the task -->
            <input
                id="todoInput"
                type="text"
                placeholder="Enter a task..."
                class="flex-1 border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <!-- Add button -->
            <button
                id="addBtn"
                class="bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700"
            >
                Add
            </button>

        </div>


        <!-- Todo list -->
        <div class="mt-6">

            <ul id="todoList" class="space-y-3">
                <!-- JavaScript will add tasks here -->
            </ul>

        </div>


        <!-- Bottom section -->
        <div class="bg-white mt-6 p-4 rounded-xl shadow-md flex justify-between items-center">

            <!-- Number of remaining tasks -->
            <p class="text-gray-600">
                Tasks:
                <span id="taskCount" class="font-bold">0</span>
            </p>

            <!-- Delete all button -->
            <button
                id="clearBtn"
                class="text-red-500 hover:text-red-700 font-medium"
            >
                Clear All
            </button>

        </div>

    </main>


    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
