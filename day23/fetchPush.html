<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <h1 class="text-3xl font-bold text-center py-8">
        Our Products
    </h1>

    <!-- Products Container -->
    <div id="productContainer"class="max-w-7xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>


    <script>

        async function fetchData() {

            try {

                const response =
                    await fetch('https://fakestoreapi.com/products');

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();

                const newData = data.map(item => ({
                    id: item.id,
                    title: item.title,
                    price: item.price,
                    image: item.image
                }));

                console.log(newData);

                return newData;

            } catch (error) {

                console.error('There has been a problem with your fetch operation:',error);
            }
        }


        async function createProductList() {

            const products = await fetchData();

            const productContainer = document.getElementById("productContainer");


            products.forEach(product => {

                // Card
                const card = document.createElement("div");
                card.className ="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition";


                // Image
                const image = document.createElement("img");
                image.src = product.image;

                image.className =
                    "w-full h-56 object-contain p-5";


                // Card Content
                const content = document.createElement("div");
                content.className = "p-5";


                // Title
                const title = document.createElement("h2");
                title.textContent = product.title;

                title.className =
                    "text-lg font-semibold text-gray-800 line-clamp-2";


                // Price
                const price = document.createElement("p");

                price.textContent = `$${product.price}`;

                price.className =
                    "text-xl font-bold text-blue-600 mt-3";


                // Button
                const button = document.createElement("button");

                button.textContent = "Add to Cart";

                button.className =
                    "w-full mt-4 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition";


                // Append
                content.appendChild(title);
                content.appendChild(price);
                content.appendChild(button);

                card.appendChild(image);
                card.appendChild(content);

                productContainer.appendChild(card);

            });

        }


        createProductList();

    </script>

</body>

</html>
